<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约成功 - 潮州青投</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1a4d7a 0%, #2d6a9f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .success-container {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a4d7a, #2d6a9f);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon svg {
            width: 40px;
            height: 40px;
            fill: white;
        }
        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .contact {
            background: #f0f7ff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .contact-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }
        .contact-info {
            font-size: 16px;
            color: #1a4d7a;
            font-weight: 500;
        }
        .btn-back {
            display: inline-block;
            background: linear-gradient(135deg, #1a4d7a, #2d6a9f);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(26, 77, 122, 0.3);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <h1>预约成功！</h1>
        <p>感谢您提交企业体检预约<br>我们的专业顾问将在24小时内与您联系确认</p>
        <div class="contact">
            <div class="contact-title">如有疑问请致电</div>
            <div class="contact-info">0768-1234567</div>
        </div>
        <a href="/" class="btn-back">返回首页</a>
    </div>
</body>
</html>
